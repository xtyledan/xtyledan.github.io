name: Capture real portfolio screenshot

on:
  push:
    paths:
      - tools/capture_readme.py
      - .github/workflows/capture-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture local portfolio
        run: python -m tools.capture_readme
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshot
          path: docs/portfolio-screenshot.png
          retention-days: 30
